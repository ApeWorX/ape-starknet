name: Test

on: ["push", "pull_request"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[lint]

      - name: Run Black
        run: black --check .

      - name: Run isort
        run: isort --check-only .

      - name: Run flake8
        run: flake8 .

      - name: Run mdformat
        run: mdformat . --check

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10"]

    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install starknet-devnet
        run: |
          # Create directory for starknet-devnet
          mkdir -p $HOME/.local/bin
          
          # Download and extract starknet-devnet based on OS
          if [ "${{ runner.os }}" == "Linux" ]; then
            curl -sSfL https://github.com/0xSpaceShard/starknet-devnet-rs/releases/download/v0.2.3/starknet-devnet-linux.tar.gz | tar -xz -C $HOME/.local/bin
          elif [ "${{ runner.os }}" == "macOS" ]; then
            curl -sSfL https://github.com/0xSpaceShard/starknet-devnet-rs/releases/download/v0.2.3/starknet-devnet-macos.tar.gz | tar -xz -C $HOME/.local/bin
          fi
          
          # Make executable
          chmod +x $HOME/.local/bin/starknet-devnet
          
          # Add to PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # Verify installation
          starknet-devnet --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run Tests
        run: pytest -m "not fuzzing" -n 0 -s --cov