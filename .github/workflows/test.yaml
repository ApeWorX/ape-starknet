name: Test

on: ["push", "pull_request"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[lint]

      - name: Run Black
        run: black --check .

      - name: Run isort
        run: isort --check-only .

      - name: Run flake8
        run: flake8 .

      - name: Run mdformat
        run: mdformat . --check

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10"]

    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install starknet-devnet
        run: |
          # Create directory for starknet-devnet
          mkdir -p $HOME/.local/bin
          
          # Determine OS and architecture
          ARCH=$(uname -m)
          OS=$(uname -s)
          
          # Set the appropriate filename based on OS and architecture
          if [ "$OS" = "Linux" ]; then
            if [ "$ARCH" = "x86_64" ]; then
              FILENAME="starknet-devnet-x86_64-unknown-linux-gnu.tar.gz"
            elif [ "$ARCH" = "aarch64" ]; then
              FILENAME="starknet-devnet-aarch64-unknown-linux-gnu.tar.gz"
            fi
          elif [ "$OS" = "Darwin" ]; then
            if [ "$ARCH" = "x86_64" ]; then
              FILENAME="starknet-devnet-x86_64-apple-darwin.tar.gz"
            elif [ "$ARCH" = "arm64" ]; then
              FILENAME="starknet-devnet-aarch64-apple-darwin.tar.gz"
            fi
          fi
          
          # Download and extract the appropriate version
          curl -sSfL "https://github.com/0xSpaceShard/starknet-devnet-rs/releases/download/v0.2.3/$FILENAME" | tar -xz -C $HOME/.local/bin
          
          # Make executable
          chmod +x $HOME/.local/bin/starknet-devnet
          
          # Add to PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # Verify installation
          starknet-devnet --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      - name: Run Tests
        run: pytest -m "not fuzzing" -n 0 -s --cov